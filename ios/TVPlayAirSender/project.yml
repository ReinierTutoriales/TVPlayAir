name: TVPlayAirSender
options:
  deploymentTarget:
    iOS: '16.0'
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk.git
    exactVersion: '4.8.6'
targets:
  TVPlayAirSender:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvplayair.sender
        SWIFT_VERSION: '5.0'
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        TARGETED_DEVICE_FAMILY: '1,2'
        CAST_RECEIVER_APP_ID: ''
    scheme: {}
