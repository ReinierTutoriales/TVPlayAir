name: Android CI

on:
  push:
    branches:
      - main
      - "build/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-spsc-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compile Linux host stress test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/shared_ring_buffer_test.cpp \
            -o shared-ring-buffer-test
      - name: Execute Linux host stress test
        run: ./shared-ring-buffer-test

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android build components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
