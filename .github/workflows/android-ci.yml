name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-spsc-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Audit resources, manifest entry points and native source inventory
        run: python3 scripts/check_repository_hygiene.py
      - name: Compile Linux host stress test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/shared_ring_buffer_test.cpp \
            -o shared-ring-buffer-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/audio_pcm_pipeline_test.cpp \
            -o audio-pcm-pipeline-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/nal_and_producer_test.cpp \
            -o nal-and-producer-test
          gcc -std=c17 -O2 -Wall -c \
            app/src/main/cpp/fairplay_v3/hand_garble.c \
            app/src/main/cpp/fairplay_v3/modified_md5.c \
            app/src/main/cpp/fairplay_v3/omg_hax.c \
            app/src/main/cpp/fairplay_v3/playfair.c \
            app/src/main/cpp/fairplay_v3/sap_hash.c
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp app/src/test/cpp/fairplay_session_test.cpp \
            hand_garble.o modified_md5.o omg_hax.o playfair.o sap_hash.o \
            -lm -o fairplay-session-test
      - name: Execute Linux host stress test
        run: |
          ./shared-ring-buffer-test
          ./audio-pcm-pipeline-test
          ./nal-and-producer-test
          ./fairplay-session-test

  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ""
      - name: Install Android build components
        run: sdkmanager --install "platforms;android-37.1" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Verify Android dependencies, JVM tests, lint, native build and debug APK
        run: ./gradlew --no-daemon :app:checkDebugAarMetadata :app:testDebugUnitTest :app:lintDebug :app:externalNativeBuildDebug :app:assembleDebug
      - name: Report lint errors on failure
        if: failure()
        run: |
          report=app/build/reports/lint-results-debug.txt
          if test -f "$report"; then
            sed -n '/Error: /p' "$report"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.0
        with:
          name: tvplayair-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Report resolved Android runtime dependencies
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath

  verify-windows-installer:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate dependency detection in Windows PowerShell 5.1
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'TVPlayAir installer'
          New-Item -ItemType Directory -Path $installDir | Out-Null
          $installer = Join-Path $installDir 'TVPlayAir.ps1'
          Copy-Item .\TVPlayAir.ps1 $installer
          Push-Location $env:RUNNER_TEMP
          try {
            $missing = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -CheckDependencies
            if ($LASTEXITCODE -ne 1 -or "$missing" -notmatch 'AdbWinUsbApi.dll') {
              throw "Expected the installer to detect missing Platform-Tools. $missing"
            }
            Copy-Item (Join-Path $env:ANDROID_HOME 'platform-tools') $installDir -Recurse
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer -CheckDependencies
            if ($LASTEXITCODE -ne 0) {
              throw 'The installer could not start Google ADB from its own directory.'
            }
          } finally {
            Pop-Location
          }
          exit 0
