name: Android CI

on:
  push:
    branches:
      - main
      - "build/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-spsc-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compile Linux host stress test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/shared_ring_buffer_test.cpp \
            -o shared-ring-buffer-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/audio_pcm_pipeline_test.cpp \
            -o audio-pcm-pipeline-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/nal_and_producer_test.cpp \
            -o nal-and-producer-test
          gcc -std=c17 -O2 -Wall -c \
            app/src/main/cpp/fairplay_v3/hand_garble.c \
            app/src/main/cpp/fairplay_v3/modified_md5.c \
            app/src/main/cpp/fairplay_v3/omg_hax.c \
            app/src/main/cpp/fairplay_v3/playfair.c \
            app/src/main/cpp/fairplay_v3/sap_hash.c
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp app/src/test/cpp/fairplay_session_test.cpp \
            hand_garble.o modified_md5.o omg_hax.o playfair.o sap_hash.o \
            -lm -o fairplay-session-test
      - name: Execute Linux host stress test
        run: |
          ./shared-ring-buffer-test
          ./audio-pcm-pipeline-test
          ./nal-and-producer-test
          ./fairplay-session-test

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android build components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvplayair-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
