name: Android CI

on:
  push:
    branches:
      - main
      - "build/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-spsc-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Compile Linux host stress test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/shared_ring_buffer_test.cpp \
            -o shared-ring-buffer-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/audio_pcm_pipeline_test.cpp \
            -o audio-pcm-pipeline-test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp app/src/test/cpp/nal_and_producer_test.cpp \
            -o nal-and-producer-test
          gcc -std=c17 -O2 -Wall -c \
            app/src/main/cpp/fairplay_v3/hand_garble.c \
            app/src/main/cpp/fairplay_v3/modified_md5.c \
            app/src/main/cpp/fairplay_v3/omg_hax.c \
            app/src/main/cpp/fairplay_v3/playfair.c \
            app/src/main/cpp/fairplay_v3/sap_hash.c
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp app/src/test/cpp/fairplay_session_test.cpp \
            hand_garble.o modified_md5.o omg_hax.o playfair.o sap_hash.o \
            -lm -o fairplay-session-test
      - name: Execute Linux host stress test
        run: |
          ./shared-ring-buffer-test
          ./audio-pcm-pipeline-test
          ./nal-and-producer-test
          ./fairplay-session-test

  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ""
      - name: Install Android build components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Verify Android dependencies, JVM tests and native build
        run: ./gradlew --no-daemon :app:checkDebugAarMetadata :app:testDebugUnitTest :app:externalNativeBuildDebug
      - name: Verify Cast-enabled receiver registration
        run: |
          ./gradlew --no-daemon -Ptvplayair.castConnect=true :app:processDebugMainManifest :app:generateDebugBuildConfig
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          manifest = Path("app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml")
          application = ET.parse(manifest).getroot().find("application")
          alias = next(item for item in application.findall("activity-alias")
                       if item.get(android + "name") == "com.tvplayair.receiver.CastReceiver")
          assert alias.get(android + "enabled") == "true", "Cast receiver alias is disabled"
          assert any(action.get(android + "name") == "com.google.android.gms.cast.tv.action.LAUNCH"
                     for action in alias.findall("intent-filter/action")), "Cast launch action is missing"
          config = Path("app/build/generated/source/buildConfig/debug/com/tvplayair/receiver/BuildConfig.java")
          assert re.search(r"CAST_CONNECT_ENABLED\s*=\s*true\s*;", config.read_text()), "Cast flag is disabled"
          PYTHON
      - name: Report resolved Android runtime dependencies
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath
